name: Release build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Tag v1.2.0 -> versionName 1.2.0. Plain pushes build as "dev".
      # versionCode is the run number, so every build installs over the previous one.
      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      # The signing key lives in repository secrets, never in the repo. See docs/RELEASING.md.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.CADENCE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cadence-release.jks"
            echo "CADENCE_KEYSTORE=$RUNNER_TEMP/cadence-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key in secrets. This APK is signed with the debug key and will not install over a release-signed build."
          fi

      - name: Build release APK
        env:
          CADENCE_STORE_PASSWORD: ${{ secrets.CADENCE_STORE_PASSWORD }}
          CADENCE_KEY_ALIAS: ${{ secrets.CADENCE_KEY_ALIAS }}
          CADENCE_KEY_PASSWORD: ${{ secrets.CADENCE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace -PappVersion="$VERSION" -PappCode="$CODE"

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Cadence-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/Cadence.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-apk
          path: dist/Cadence.apk

      # Permanent release for every version tag. Never deleted, so all versions stay on your Releases page.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If you already drafted the release by hand, attach the APK to it. Otherwise create it.
          for i in 1 2 3; do
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "dist/Cadence-$VERSION.apk" --clobber && exit 0
            else
              gh release create "$GITHUB_REF_NAME" "dist/Cadence-$VERSION.apk" \
                --title "Cadence $VERSION" --generate-notes && exit 0
            fi
            echo "Attempt $i failed, retrying..."; sleep 10
          done
          exit 1

      # Rolling "latest" for quick installs from the main branch (replaced on each push).
      - name: Publish rolling latest
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh release delete latest --cleanup-tag --yes || true
            gh release create latest dist/Cadence.apk \
              --title "Cadence (latest build)" \
              --notes "Rolling build from commit ${GITHUB_SHA::7}. Tag a version (git tag v1.1.0) to keep a permanent copy." \
              --prerelease && exit 0
            echo "Attempt $i failed, retrying..."; sleep 10
          done
          exit 1
