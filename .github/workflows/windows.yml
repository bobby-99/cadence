name: Windows app

on:
  push:
    branches: [main, master]
    paths: ["windows/**", "docs/SYNC.md", "docs/icon.*", ".github/workflows/windows.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["windows/**", "docs/SYNC.md", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Test the shared logic
        run: cargo test --manifest-path windows/Cargo.toml -p cadence-core --locked

      - name: Build
        run: cargo build --manifest-path windows/Cargo.toml -p cadence --release --locked

      - name: Name the file
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp windows/target/release/cadence.exe "dist/Cadence-$VERSION-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-windows
          path: dist/*.exe

      # Attach the .exe to the same release the APK job creates. Whichever job gets there first creates it.
      - name: Attach to the version release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "dist/Cadence-$VERSION-windows-x64.exe" --clobber && exit 0
            else
              gh release create "$GITHUB_REF_NAME" "dist/Cadence-$VERSION-windows-x64.exe" --title "Cadence $VERSION" --generate-notes && exit 0
            fi
            echo "Attempt $i failed, retrying..."; sleep 15
          done
          exit 1
