name: Bug report
description: Something is broken or behaves wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Cadence version
      description: Settings, About
    validations: { required: true }
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 8, Android 15"
    validations: { required: true }
  - type: textarea
    id: reminders
    attributes:
      label: For a reminder that did not show
      description: What does Settings, Permissions say? Was the phone idle, locked or off? Which phone maker?
