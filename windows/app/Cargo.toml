[package]
name = "cadence"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
description = "Cadence for Windows: a small, fast to-do app that syncs with Cadence on Android through a folder"
build = "build.rs"

[dependencies]
cadence-core = { path = "../core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-software", "software-renderer-systemfonts", "compat-1-2"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
